# Render Blueprint — MediFlow no-auth DEMO deployment.
#
# Stands up a single web service (api-server serving the built web-app) plus a
# managed Postgres, seeded with the INSUREitALL demo data, with authentication
# bypassed so a design partner can click a URL and see the real product.
#
# How the demo wiring works:
#   - VITE_DEMO_MODE=true (build time) swaps Clerk for inert shims in the web
#     bundle, so the authenticated shell renders with a fixed seeded identity.
#   - DEMO_MODE=true (runtime) makes the api-server skip Clerk and resolve every
#     request to the seeded demo admin (see lib/demoMode.ts + requireAuth.ts).
#   - NODE_ENV=development keeps DEMO_MODE active (it is a hard no-op under
#     NODE_ENV=production) and the prod-env guard refuses to boot if real
#     Clerk/PHI credentials are ever attached. No Clerk keys are needed.
#
# This blueprint is intentionally NOT a production template — it deploys an
# auth-bypassing build against throwaway demo data.
databases:
  - name: mediflow-demo-db
    plan: free
    databaseName: mediflow_demo
    user: mediflow

services:
  - type: web
    name: mediflow-demo
    runtime: node
    # Free instance for the throwaway demo (sleeps when idle, $0). Bump to
    # starter/standard if you need it always-on.
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@10.28.1 --activate && pnpm install --frozen-lockfile && VITE_DEMO_MODE=true pnpm --filter @workspace/web-app run build && pnpm --filter @workspace/api-server run build
    # Migrate + seed run at container START, not preDeployCommand (silently
    # skipped on plan:free) and not buildCommand (DATABASE_URL injection into
    # free-plan build environments is not guaranteed; runtime env always has
    # it). Both are idempotent when serial; if a deploy overlaps a waking
    # instance, one boot's attempt may lose a unique-key race — that failure
    # is logged, non-fatal (see below), and the surviving instance completes
    # the work. If this service is ever bumped to starter+, preDeployCommand
    # runs exactly once per deploy and is the cleaner shape.
    # Migrate failure REFUSES to start (drizzle wraps each migration file in
    # its own transaction, so a retry on the next container start is clean —
    # a restart loop until the DB is reachable is the correct signal to
    # Render). Seed failure stays fail-open: the app serves fine against an
    # already-seeded DB, and the advisory-locked seeder self-heals next wake.
    startCommand: >-
      pnpm --filter @workspace/db run migrate || { echo 'migrate failed — refusing to start'; exit 1; };
      pnpm seed:demo || echo 'seed failed — continuing';
      pnpm --filter @workspace/api-server run start
    # Probe readiness, not the static SPA shell: / returns 200 from
    # express.static regardless of DB state, so a half-migrated wake would
    # look healthy. /api/readyz gates on DB + workers.
    healthCheckPath: /api/readyz
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: development
      - key: DEMO_MODE
        value: "true"
      - key: WEB_STATIC_DIR
        value: /opt/render/project/src/artifacts/web-app/dist/public
      - key: DATABASE_URL
        fromDatabase:
          name: mediflow-demo-db
          property: connectionString
