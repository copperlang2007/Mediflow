# Render Blueprint — MediFlow no-auth DEMO deployment.
#
# Stands up a single web service (api-server serving the built web-app) plus a
# managed Postgres, seeded with the INSUREitALL demo data, with authentication
# bypassed so a design partner can click a URL and see the real product.
#
# How the demo wiring works:
#   - VITE_DEMO_MODE=true (build time) swaps Clerk for inert shims in the web
#     bundle, so the authenticated shell renders with a fixed seeded identity.
#   - DEMO_MODE=true (runtime) makes the api-server skip Clerk and resolve every
#     request to the seeded demo admin (see lib/demoMode.ts + requireAuth.ts).
#   - NODE_ENV=development keeps DEMO_MODE active (it is a hard no-op under
#     NODE_ENV=production) and the prod-env guard refuses to boot if real
#     Clerk/PHI credentials are ever attached. No Clerk keys are needed.
#
# This blueprint is intentionally NOT a production template — it deploys an
# auth-bypassing build against throwaway demo data.
databases:
  - name: mediflow-demo-db
    plan: free
    databaseName: mediflow_demo
    user: mediflow

services:
  - type: web
    name: mediflow-demo
    runtime: node
    # Free instance for the throwaway demo (sleeps when idle, $0). Bump to
    # starter/standard if you need it always-on.
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@10.28.1 --activate && pnpm install --frozen-lockfile && VITE_DEMO_MODE=true pnpm --filter @workspace/web-app run build && pnpm --filter @workspace/api-server run build
    # Apply migrations and (idempotently) seed the demo data before the new
    # version goes live. seed:demo is a no-op once the demo org exists.
    preDeployCommand: pnpm --filter @workspace/db run migrate && pnpm seed:demo
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: development
      - key: DEMO_MODE
        value: "true"
      - key: WEB_STATIC_DIR
        value: /opt/render/project/src/artifacts/web-app/dist/public
      - key: DATABASE_URL
        fromDatabase:
          name: mediflow-demo-db
          property: connectionString
