# Render Blueprint — MediFlow PRODUCTION deployment.
#
# This is the production counterpart to render.yaml (which is the auth-bypassed
# DEMO blueprint). It stands up a managed Postgres plus a single web service
# (api-server serving the built web-app) running NODE_ENV=production with real
# Clerk auth and PHI encryption enabled.
#
# Secrets are intentionally NOT stored here. They are injected at deploy time by
# .github/workflows/deploy-mediflow-render.yml via scripts/deploy/render-deploy.mjs,
# which:
#   - generates the cryptographic keys (PHI_ENCRYPTION_KEY, PHI_HMAC_KEY,
#     METRICS_TOKEN, *_WEBHOOK_SECRET) once and persists them on the service so
#     they stay STABLE across deploys (rotating PHI keys would orphan encrypted
#     data), and
#   - copies your third-party credentials (Clerk, Bedrock, GCS, Twilio,
#     Resend, Sentry) from GitHub Secrets into the Render service env.
#
# Every var below marked `sync: false` is owned by that script, so a blueprint
# re-sync never clobbers an injected secret. You only ever populate GitHub
# Secrets once — see docs/DEPLOY_RENDER_PRODUCTION.md.
#
# HARD BOOT GUARDS (the server refuses to start otherwise):
#   - NODE_ENV must be exactly "production" once real credentials are present.
#   - AI_INTEGRATIONS_PROVIDER must be a HIPAA-eligible provider in production:
#     "azure" or "bedrock". See artifacts/api-server/src/lib/aiProvider.ts.
#   - PHI_ENCRYPTION_KEY / PHI_HMAC_KEY must be set (medicareId.ts).
#   - PRIVATE_OBJECT_DIR must be set (objectStorage.ts).
#   - DEMO_MODE must never be "true" here (prodEnvGuard.ts).

databases:
  - name: mediflow-prod-db
    plan: standard
    databaseName: mediflow_prod
    user: mediflow

services:
  - type: web
    name: mediflow-prod
    runtime: node
    plan: standard
    region: oregon
    branch: claude/product-market-launch-selection-iw23qv
    # VITE_CLERK_PUBLISHABLE_KEY is read from the service env at build time and
    # inlined into the web bundle by Vite. The deploy script sets it (mirroring
    # CLERK_PUBLISHABLE_KEY) before the build runs. NOTE: no VITE_DEMO_MODE here
    # — that is what keeps this a real authenticated build.
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@10.28.1 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/web-app run build &&
      pnpm --filter @workspace/api-server run build
    # Apply DB migrations before the new version goes live. No demo seeding in
    # production — the database starts empty and is populated through the app.
    preDeployCommand: pnpm --filter @workspace/db run migrate
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      # ---- Static, non-secret runtime config (safe to keep in source) ----
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000" # Render's default injected port; api-server reads PORT
      - key: WEB_STATIC_DIR
        value: /opt/render/project/src/artifacts/web-app/dist/public
      - key: AI_INTEGRATIONS_PROVIDER
        value: bedrock # HIPAA: AWS Bedrock is BAA-covered (your signed AWS BAA)
      - key: AI_INTEGRATIONS_MODEL
        value: us.anthropic.claude-sonnet-4-6 # Bedrock model id (matches IntelBRIDGE)
      - key: MFA_REQUIRED
        value: "true"
      - key: LOG_LEVEL
        value: info

      # ---- Database (provisioned above) ----
      - key: DATABASE_URL
        fromDatabase:
          name: mediflow-prod-db
          property: connectionString

      # ---- Cryptographic keys: generated & persisted by the deploy script ----
      # (declared so a blueprint sync won't delete them; the script owns values)
      - key: PHI_ENCRYPTION_KEY
        sync: false
      - key: PHI_HMAC_KEY
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: DIALER_WEBHOOK_SECRET
        sync: false
      - key: LEAD_QUEUE_WEBHOOK_SECRET
        sync: false

      # ---- Third-party credentials: injected from GitHub Secrets ----
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_ORIGIN # set to the service's public URL by the deploy script
        sync: false
      # Bedrock API key (Bearer token) consumed by the OpenAI SDK client.
      - key: AI_INTEGRATIONS_BEDROCK_API_KEY
        sync: false
      # Bedrock's ANTHROPIC MESSAGES endpoint, e.g.
      # https://bedrock-runtime.<region>.amazonaws.com/anthropic
      # NOT /openai/v1 — AWS lists Chat Completions as unsupported for every
      # Anthropic model, so Claude is unreachable over that path.
      - key: AI_INTEGRATIONS_BEDROCK_BASE_URL
        sync: false
      # Legacy name, still read as a fallback by resolveAiBaseUrl() so a
      # pre-rename Render service keeps booting. Set the BEDROCK one above.
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      - key: PRIVATE_OBJECT_DIR
        sync: false
      - key: PUBLIC_OBJECT_SEARCH_PATHS
        sync: false
      # Optional feature credentials (omitted cleanly if the GitHub Secret is unset)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: SENTRY_DSN
        sync: false
