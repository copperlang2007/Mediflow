# Live local Docker instance of agencyBRIDGE — demo-mode build (mirrors the
# no-auth Render demo blueprint in render.yaml), so no sign-in/PHI credentials
# are required to boot. Not for production use.
#
# Usage:
#   docker compose up --build
#   open http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mediflow
      POSTGRES_PASSWORD: mediflow
      POSTGRES_DB: mediflow_demo
    volumes:
      - mediflow-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediflow -d mediflow_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DEMO_MODE: "true"
      PORT: "3000"
      DATABASE_URL: postgres://mediflow:mediflow@postgres:5432/mediflow_demo
      WEB_STATIC_DIR: /app/artifacts/web-app/dist/public
      ALLOWED_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  mediflow-postgres-data:
