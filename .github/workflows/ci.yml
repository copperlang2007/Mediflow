name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

  pnpm-audit:
    name: pnpm audit (critical)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Fail the build on any critical-severity advisory in the resolved
      # dependency tree. We currently gate at `critical` rather than `high`
      # because of a known high-severity transitive advisory on `js-cookie`
      # (GHSA-qjx8-664m-686j) reached via `@clerk/shared` — there is no
      # upstream patch path yet without bumping Clerk. Re-tighten this to
      # `--audit-level=high` once that resolves.
      - name: pnpm audit
        run: pnpm audit --audit-level=critical

      # Informational: surface high-and-above advisories in the job log
      # so they remain visible while the gate is parked at `critical`.
      - name: pnpm audit (informational, high+)
        if: always()
        continue-on-error: true
        run: pnpm audit --audit-level=high
