name: Deploy agencyBRIDGE (Google Cloud • production)

# Ships agencyBRIDGE to Cloud Run in production mode. One-time setup
# (scripts/deploy/gcp-bootstrap.sh + docs/DEPLOY_GCP_PRODUCTION.md) provisions
# the project, Cloud SQL, the PHI bucket, service accounts, and Workload
# Identity Federation. After that, every push to this branch builds the
# production image and deploys it with no manual steps and no GCP JSON key
# stored in GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-mediflow-gcp
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  deploy:
    name: Build + deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Stay green until ALL required secrets are configured, matching the
      # Render deploy workflow's behavior — a red ✗ on every push during
      # incremental secret setup is not "zero-touch". Runs automatically once
      # the full set is present.
      - name: Check GCP deploy is configured
        id: gate
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA_EMAIL: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}
          GCP_RUN_SA_EMAIL: ${{ secrets.GCP_RUN_SA_EMAIL }}
          GCP_CLOUDSQL_CONNECTION: ${{ secrets.GCP_CLOUDSQL_CONNECTION }}
          GCP_PHI_BUCKET: ${{ secrets.GCP_PHI_BUCKET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          AI_INTEGRATIONS_BEDROCK_API_KEY: ${{ secrets.AI_INTEGRATIONS_BEDROCK_API_KEY }}
          AI_INTEGRATIONS_OPENAI_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENAI_API_KEY }}
          AI_INTEGRATIONS_BEDROCK_BASE_URL: ${{ secrets.AI_INTEGRATIONS_BEDROCK_BASE_URL }}
          AI_INTEGRATIONS_OPENAI_BASE_URL: ${{ secrets.AI_INTEGRATIONS_OPENAI_BASE_URL }}
        run: |
          # The base URL may be set under either name: BEDROCK is canonical,
          # OPENAI is the legacy fallback. Requiring the new name outright
          # would skip the deploy for an environment that is correctly
          # configured under the old one.
          if [ -z "$(printf '%s' "${AI_INTEGRATIONS_BEDROCK_BASE_URL:-}" | tr -d '[:space:]')" ]; then
            AI_INTEGRATIONS_BEDROCK_BASE_URL="${AI_INTEGRATIONS_OPENAI_BASE_URL:-}"
          fi
          # Same either-name contract for the API key. BEDROCK is canonical;
          # the OPENAI name is the legacy fallback (the value is a Bedrock
          # bearer token either way, never an OpenAI credential).
          if [ -z "$(printf '%s' "${AI_INTEGRATIONS_BEDROCK_API_KEY:-}" | tr -d '[:space:]')" ]; then
            AI_INTEGRATIONS_BEDROCK_API_KEY="${AI_INTEGRATIONS_OPENAI_API_KEY:-}"
          fi
          missing=()
          for v in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_DEPLOY_SA_EMAIL GCP_RUN_SA_EMAIL \
                   GCP_CLOUDSQL_CONNECTION GCP_PHI_BUCKET CLERK_SECRET_KEY CLERK_PUBLISHABLE_KEY \
                   AI_INTEGRATIONS_BEDROCK_API_KEY AI_INTEGRATIONS_BEDROCK_BASE_URL; do
            # Trim before testing: the app trims these values and treats
            # whitespace as unset, so a gate using bare -z would pass a
            # config the runtime then rejects.
            if [ -z "$(printf '%s' "${!v}" | tr -d '[:space:]')" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::Deploy skipped — required GitHub Secrets not yet set: ${missing[*]}. Run scripts/deploy/gcp-bootstrap.sh, then see docs/DEPLOY_GCP_PRODUCTION.md. The deploy runs automatically once all are present."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.gate.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA_EMAIL }}

      - name: Set up gcloud
        if: steps.gate.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        if: steps.gate.outputs.configured == 'true'
        run: bash scripts/deploy/gcp-deploy.sh
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
          GCP_NETWORK: ${{ secrets.GCP_NETWORK || 'default' }}
          GCP_RUN_SA_EMAIL: ${{ secrets.GCP_RUN_SA_EMAIL }}
          GCP_CLOUDSQL_CONNECTION: ${{ secrets.GCP_CLOUDSQL_CONNECTION }}
          GCP_PHI_BUCKET: ${{ secrets.GCP_PHI_BUCKET }}

          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          # AI on AWS Bedrock (unchanged — covered by your AWS BAA). The API
          # key is a Bedrock Bearer token; the base URL is Bedrock's
          # ANTHROPIC MESSAGES endpoint, e.g.
          # https://bedrock-runtime.<region>.amazonaws.com/anthropic
          # NOT /openai/v1 — AWS lists Chat Completions as unsupported for
          # every Anthropic model, so Claude is unreachable over that path.
          # BOTH key names must reach the deploy step, for the same reason the
          # base URL does: the gate's shell fallback is step-scoped and does
          # not persist, so passing only one name would let an operator who
          # followed the docs pass the gate and then hard-fail in the script.
          AI_INTEGRATIONS_BEDROCK_API_KEY: ${{ secrets.AI_INTEGRATIONS_BEDROCK_API_KEY }}
          AI_INTEGRATIONS_OPENAI_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENAI_API_KEY }}
          # BOTH base-URL names must reach the deploy step. The gate's shell default is
          # step-scoped and does not persist here, so passing only the legacy
          # name would let an operator who followed the docs (canonical name
          # only) pass the gate and then hit an immediate exit in
          # gcp-deploy.sh -- green pipeline, no deploy.
          AI_INTEGRATIONS_BEDROCK_BASE_URL: ${{ secrets.AI_INTEGRATIONS_BEDROCK_BASE_URL }}
          AI_INTEGRATIONS_OPENAI_BASE_URL: ${{ secrets.AI_INTEGRATIONS_OPENAI_BASE_URL }}
          AI_INTEGRATIONS_MODEL: ${{ vars.AI_INTEGRATIONS_MODEL }}

          APP_ORIGIN: ${{ vars.GCP_APP_ORIGIN }}
          MIN_INSTANCES: ${{ vars.MIN_INSTANCES }}
          MAX_INSTANCES: ${{ vars.MAX_INSTANCES }}

          # Optional — passed through only if set (feature no-ops otherwise).
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_WEBHOOK_PUBLIC_HOST: ${{ secrets.TWILIO_WEBHOOK_PUBLIC_HOST }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          CONTRACTING_EMAIL_FROM: ${{ vars.CONTRACTING_EMAIL_FROM }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ESIGN_SIGNING_CERT_PEM: ${{ secrets.ESIGN_SIGNING_CERT_PEM }}
          ESIGN_SIGNING_KEY_PEM: ${{ secrets.ESIGN_SIGNING_KEY_PEM }}
          PUBLIC_OBJECT_SEARCH_PATHS: ${{ secrets.PUBLIC_OBJECT_SEARCH_PATHS }}
          # Either name works for each (the second is what the repo was set up with).
          ENROLLHERE_WEBHOOK_SECRET: ${{ secrets.ENROLLHERE_WEBHOOK_SECRET || secrets.ENROLLHERE_WEBHOOK_PASSWORD }}
          GHL_PRIVATE_INTEGRATION_TOKEN: ${{ secrets.GHL_PRIVATE_INTEGRATION_TOKEN || secrets.GHL_BEARER_TOKEN }}
          GHL_LOCATION_ID: ${{ vars.GHL_LOCATION_ID || secrets.GHL_LOCATION_ID }}
          GHL_SYNC_ORG_IDS: ${{ vars.GHL_SYNC_ORG_IDS }}
          STATEMENT_INGEST_GOOGLE_CREDENTIALS: ${{ secrets.STATEMENT_INGEST_GOOGLE_CREDENTIALS }}

          GITHUB_SHA: ${{ github.sha }}

      - name: Install pnpm for browser smoke
        if: steps.gate.outputs.configured == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node for browser smoke
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify deployed page in Chromium
        if: steps.gate.outputs.configured == 'true'
        env:
          GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          export MEDIFLOW_URL="$(gcloud run services describe mediflow-prod --region "$GCP_REGION" --format='value(status.url)')"
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            page.on('requestfailed', request => errors.push(`${request.url()}: ${request.failure()?.errorText}`));
            await page.goto(process.env.MEDIFLOW_URL, { waitUntil: 'domcontentloaded' });
            await page.getByRole('heading', { name: 'Your agency, moving together.' }).waitFor({ timeout: 20000 });
            await page.goto(new URL('/sign-in', process.env.MEDIFLOW_URL).href, { waitUntil: 'domcontentloaded' });
            await page.getByRole('textbox').first().waitFor({ timeout: 20000 });
            console.log('Production landing and sign-in render in Chromium');
          } catch (error) {
            console.error('Production browser smoke failed:', error.message);
            throw error;
          } finally {
            await browser.close();
          }
          NODE
