          type: object
          additionalProperties: true
          nullable: true
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/AutomationCondition"
          nullable: true
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AutomationAction"
          nullable: true
        isActive: { type: boolean }
        lastRunAt: { type: string, format: date-time, nullable: true }
        runCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, orgId, name, triggerType, isActive, runCount, createdAt, updatedAt]

    AutomationRuleListResponse:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AutomationRule"
        total: { type: integer }
      required: [rules, total]

    CreateAutomationRuleBody:
      type: object
      properties:
        name: { type: string }
        triggerType: { type: string }
        triggerConfig:
          type: object
          additionalProperties: true
          nullable: true
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/AutomationCondition"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AutomationAction"
        isActive: { type: boolean }
      required: [name, triggerType, actions]

    UpdateAutomationRuleBody:
      type: object
      properties:
        name: { type: string }
        triggerType: { type: string }
        triggerConfig:
          type: object
          additionalProperties: true
          nullable: true
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/AutomationCondition"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AutomationAction"
        isActive: { type: boolean }

    AutomationRuleLog:
      type: object
      properties:
        id: { type: string }
        ruleId: { type: string }
        triggerEvent: { type: string, nullable: true }
        matchedRecordType: { type: string, nullable: true }
        matchedRecordId: { type: string, nullable: true }
        actionsExecuted:
          type: array
          items: { type: string }
          nullable: true
        result:
          type: string
          enum: [success, partial, failed]
        errorMessage: { type: string, nullable: true }
        executedAt: { type: string, format: date-time }
      required: [id, ruleId, result, executedAt]

    RunAutomationRuleBody:
      type: object
      properties:
        resourceType: { type: string }
        resourceId: { type: string }

    RunAutomationRuleResponse:
      type: object
      properties:
        queued: { type: boolean }
        ruleId: { type: string }
      required: [queued, ruleId]

    AiChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content: { type: string }
      required: [role, content]

    AiChatContext:
      type: object
      properties:
        pageType:
          type: string
          enum: [dashboard, agent, contact, other]
        agentId: { type: string }
        contactId: { type: string }

    AiChatBody:
      type: object
      properties:
        message: { type: string }
        history:
          type: array
          items:
            $ref: "#/components/schemas/AiChatMessage"
        context:
          $ref: "#/components/schemas/AiChatContext"
      required: [message]

    AiDraftBody:
      type: object
      properties:
        channel:
          type: string
          enum: [sms, email]
        contactId: { type: string }
        goal: { type: string }
      required: [channel, contactId, goal]

    AiDraftResponse:
      type: object
      properties:
        draft: { type: string }
        subject: { type: string }
        aiAssisted: { type: boolean }
      required: [draft, aiAssisted]

    AgentPerformanceRow:
      type: object
      properties:
        agentId: { type: string }
        agentName: { type: string }
        email: { type: string }
        status: { type: string }
        contactsWorked: { type: integer }
        callsLogged: { type: integer }
        dealsWon: { type: integer }
        dealValueWon: { type: number }
        enrolledContacts: { type: integer }
        complianceScore: { type: integer }
        licensesActive: { type: integer }
        licensesExpiring: { type: integer }
        certificationsPassed: { type: integer }
        ahipStatus: { type: string }
      required: [agentId, agentName, email, status, contactsWorked, callsLogged, dealsWon, dealValueWon, enrolledContacts, complianceScore, licensesActive, licensesExpiring, certificationsPassed, ahipStatus]

    PipelineFunnelStage:
      type: object
      properties:
        stageId: { type: string }
        stageName: { type: string }
        orderIndex: { type: integer }
        dealCount: { type: integer }
        totalValue: { type: number }
        wonCount: { type: integer }
        lostCount: { type: integer }
      required: [stageId, stageName, orderIndex, dealCount, totalValue, wonCount, lostCount]

    PipelineReportRow:
      type: object
      properties:
        pipelineId: { type: string }
        pipelineName: { type: string }
        totalDeals: { type: integer }
        wonDeals: { type: integer }
        lostDeals: { type: integer }
        winRate: { type: number }
        totalWonValue: { type: number }
        funnel:
          type: array
          items:
            $ref: "#/components/schemas/PipelineFunnelStage"
      required: [pipelineId, pipelineName, totalDeals, wonDeals, lostDeals, winRate, totalWonValue, funnel]

    LeadSourceRow:
      type: object
      properties:
        source: { type: string }
        total: { type: integer }
        converted: { type: integer }
        enrolled: { type: integer }
        conversionRate: { type: number }
        enrollmentRate: { type: number }
      required: [source, total, converted, enrolled, conversionRate, enrollmentRate]

    LeadsReport:
      type: object
      properties:
        sourceBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/LeadSourceRow"
        trend:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              count: { type: integer }
            required: [date, count]
        totalLeads: { type: integer }
        convertedLeads: { type: integer }
      required: [sourceBreakdown, trend, totalLeads, convertedLeads]

    ComplianceMatrixReport:
      type: object
      properties:
        licenseMatrix: { type: array, items: { type: object } }
        expiryByMonth: { type: array, items: { type: object } }
        carrierCertCompletion: { type: array, items: { type: object } }
        ahipTrend: { type: array, items: { type: object } }
      required: [licenseMatrix, expiryByMonth, carrierCertCompletion, ahipTrend]

    CommunicationsReport:
      type: object
      properties:
        totalSms: { type: integer }
        totalEmail: { type: integer }
        aiAssistedSms: { type: integer }
        aiAssistedEmail: { type: integer }
        trend:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              sms: { type: integer }
              email: { type: integer }
            required: [date, sms, email]
      required: [totalSms, totalEmail, aiAssistedSms, aiAssistedEmail, trend]

    RetentionReport:
      type: object
      properties:
        enrolledContacts: { type: integer }
        lostContacts: { type: integer }
        atRiskContacts: { type: integer }
        retentionRate: { type: number }
        atRiskRate: { type: number }
      required: [enrolledContacts, lostContacts, atRiskContacts, retentionRate, atRiskRate]

    PaginatedAuditLog:
      type: object
      properties:
        entries: { type: array, items: { type: object } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
      required: [entries, total, limit, offset]

    UserAccessReviewRow:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        fullName: { type: string }
        role: { type: string }
        isActive: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
      required: [id, email, fullName, role, isActive, createdAt]

    LoginEvent:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        userId: { type: string, nullable: true }
        email: { type: string, nullable: true }
        success: { type: boolean }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        failureReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
      required: [id, orgId, success, createdAt]

    PaginatedLoginHistory:
      type: object
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/LoginEvent" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
      required: [events, total, limit, offset]

    ExportLogEntry:
      type: object
      properties:
        id: { type: string }
        userId: { type: string, nullable: true }
        exportType: { type: string }
        filters: { type: object, nullable: true }
        recordCount: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        userFullName: { type: string, nullable: true }
      required: [id, exportType, createdAt]

    PaginatedExportLog:
      type: object
      properties:
        exports: { type: array, items: { $ref: "#/components/schemas/ExportLogEntry" } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
      required: [exports, total, limit, offset]

    SessionConfig:
      type: object
      properties:
        sessionTimeoutMinutes:
          type: integer
          enum: [15, 30, 60]
      required: [sessionTimeoutMinutes]

    DataRetentionPolicy:
      type: object
      properties:
        id: { type: string, nullable: true }
        orgId: { type: string }
        recordType: { type: string }
        retentionDays: { type: integer }
        isEnabled: { type: boolean }
        updatedAt: { type: string, format: date-time }
        updatedByUserId: { type: string, nullable: true }
      required: [orgId, recordType, retentionDays, isEnabled]

    UpdateDataRetentionPolicyBody:
      type: object
      properties:
        recordType: { type: string }
        retentionDays:
          type: integer
          minimum: 3650
          maximum: 36500
          description: At least 3650 days — CMS requires MA/Part D records be kept 10 years.
        isEnabled: { type: boolean }
      required: [recordType, retentionDays, isEnabled]

    BaaControl:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        status:
          type: string
          enum: [pass, warn, partial, fail]
        note: { type: string }
        evidenceUrl: { type: string }
      required: [id, label, status]

    BaaChecklist:
      type: object
      properties:
        controls:
          type: array
          items:
            $ref: "#/components/schemas/BaaControl"
        overall:
          type: string
          enum: [pass, warn, partial, fail]
        generatedAt: { type: string, format: date-time }
      required: [controls, overall, generatedAt]

    ImportUploadResponse:
      type: object
      properties:
        headers: { type: array, items: { type: string } }
        sampleRows: { type: array, items: { type: object } }
        totalRows: { type: integer }
        suggestedMapping: { type: object }
        targetFields:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              label: { type: string }
              required: { type: boolean }
            required: [field, label]
      required: [headers, sampleRows, totalRows, suggestedMapping, targetFields]

    ImportValidationResponse:
      type: object
      properties:
        totalRows: { type: integer }
        errorCount: { type: integer }
        validRows: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              field: { type: string }
              message: { type: string }
              value: { type: string }
            required: [row, field, message]
      required: [totalRows, errorCount, validRows, errors]

    GhlValidationResponse:
      type: object
      properties:
        totalRows: { type: integer }
        errorCount: { type: integer }
        validRows: { type: integer }
        errors: { type: array, items: { type: object } }
        duplicateEmails: { type: integer }
        duplicatePhones: { type: integer }
      required: [totalRows, errorCount, validRows, errors, duplicateEmails, duplicatePhones]

    ImportJobStarted:
      type: object
      properties:
        jobId: { type: string }
        totalRows: { type: integer }
      required: [jobId, totalRows]

    ImportJob:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        userId: { type: string, nullable: true }
        importType: { type: string }
        status: { type: string }
        totalRows: { type: integer }
        processedRows: { type: integer }
        createdCount: { type: integer }
        updatedCount: { type: integer }
        skippedCount: { type: integer }
        errorCount: { type: integer }
        fileName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
      required: [id, orgId, importType, status, totalRows, processedRows, createdCount, updatedCount, skippedCount, errorCount, createdAt]

    # ---- Onboarding ------------------------------------------------------

    OnboardingStatus:
      type: string
      enum:
        - draft
        - profile_in_progress
        - carriers_selected
        - signing
        - submitted
        - complete
        - cancelled
        - rejected

    ContractingStatus:
      type: string
      enum:
        - draft
        - paperwork_generated
        - signed
        - submitted
        - under_review
        - appointed
        - rejected
        - cancelled
        - awaiting_admin_submission
        - invite_requested

    PoaStatus:
      type: string
      description: |
        Phase 1.5 POA decision state recorded on agent_onboarding_runs.
        `not_applicable` is the default for runs that have not (yet) reached
        the POA decision step or for legacy runs that pre-date the pivot.
      enum:
        - not_applicable
        - pending
        - signed
        - opted_out

    EntityType:
      type: string
      enum: [individual, llc, corp, partnership]

    AgentOnboardingRun:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        agentId: { type: string }
        startedByUserId:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/OnboardingStatus"
        poaStatus:
          $ref: "#/components/schemas/PoaStatus"
        poaEnvelopeId:
          type: ["string", "null"]
        poaExpiresAt:
          type: ["string", "null"]
          format: date-time
        completedSteps:
          type: ["object", "null"]
          additionalProperties: { type: boolean }
        startedAt: { type: string, format: date-time }
        completedAt:
          type: ["string", "null"]
          format: date-time
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - orgId
        - agentId
        - status
        - startedAt
        - updatedAt

    AgentContractingProfile:
      type: object
      description: |
        Agent contracting profile (PII). `ssn`, `ein`, and `dob` are returned
        either as plaintext (for PHI-privileged roles or self-on-own-record)
        or as fixed masked sentinels (`***-**-****` / `**-*******` / null).
      properties:
        id: { type: string }
        orgId: { type: string }
        agentId: { type: string }
        ssn:
          type: ["string", "null"]
        ein:
          type: ["string", "null"]
        dob:
          type: ["string", "null"]
          format: date
        homeAddressLine1: { type: ["string", "null"] }
        homeAddressLine2: { type: ["string", "null"] }
        homeCity: { type: ["string", "null"] }
        homeState: { type: ["string", "null"] }
        homeZip: { type: ["string", "null"] }
        mailingSameAsHome: { type: ["boolean", "null"] }
        mailingAddressLine1: { type: ["string", "null"] }
        mailingAddressLine2: { type: ["string", "null"] }
        mailingCity: { type: ["string", "null"] }
        mailingState: { type: ["string", "null"] }
        mailingZip: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"], format: email }
        entityType:
          oneOf:
            - $ref: "#/components/schemas/EntityType"
            - type: "null"
        businessName: { type: ["string", "null"] }
        eAndOCarrier: { type: ["string", "null"] }
        eAndOPolicyNumber: { type: ["string", "null"] }
        eAndOExpiresOn:
          type: ["string", "null"]
          format: date
        backgroundCheckAuthorized:
          type: ["boolean", "null"]
      required:
        - orgId
        - agentId

    CarrierContractingRequest:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        onboardingRunId: { type: string }
        agentId: { type: string }
        carrierId: { type: string }
        states:
          type: array
          items: { type: string }
        status:
          $ref: "#/components/schemas/ContractingStatus"
        paperworkDocumentId:
          type: ["string", "null"]
        signatureCompletedAt:
          type: ["string", "null"]
          format: date-time
        writingNumber:
          type: ["string", "null"]
        lastStatusChangeAt:
          type: ["string", "null"]
          format: date-time
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - orgId
        - onboardingRunId
        - agentId
        - carrierId
        - states
        - status
        - createdAt
        - updatedAt

    OnboardingDetail:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/AgentOnboardingRun"
        profile:
          oneOf:
            - $ref: "#/components/schemas/AgentContractingProfile"
            - type: "null"
        carrierRequests:
          type: array
          items:
            $ref: "#/components/schemas/CarrierContractingRequest"
      required: [run, carrierRequests]

    OnboardingListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentOnboardingRun"
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
      required: [data, total, limit, offset]

    StartOnboardingBody:
      type: object
      properties:
        agentId:
          type: string
          minLength: 1
      required: [agentId]

    StartOnboardingResponse:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/AgentOnboardingRun"
        profile:
          oneOf:
            - $ref: "#/components/schemas/AgentContractingProfile"
            - type: "null"
        idempotent: { type: boolean }
      required: [run, idempotent]

    PatchOnboardingProfileBody:
      type: object
      description: |
        Partial patch over the agent contracting profile. `null` clears the
        field; an omitted key leaves the current value untouched.
      properties:
        ssn: { type: ["string", "null"] }
        dob:
          type: ["string", "null"]
          format: date
        homeAddressLine1: { type: ["string", "null"], maxLength: 200 }
        homeAddressLine2: { type: ["string", "null"], maxLength: 200 }
        homeCity: { type: ["string", "null"], maxLength: 100 }
        homeState: { type: ["string", "null"], minLength: 2, maxLength: 2 }
        homeZip: { type: ["string", "null"], maxLength: 10 }
        mailingSameAsHome: { type: boolean }
        mailingAddressLine1: { type: ["string", "null"], maxLength: 200 }
        mailingAddressLine2: { type: ["string", "null"], maxLength: 200 }
        mailingCity: { type: ["string", "null"], maxLength: 100 }
        mailingState: { type: ["string", "null"], minLength: 2, maxLength: 2 }
        mailingZip: { type: ["string", "null"], maxLength: 10 }
        phone: { type: ["string", "null"], maxLength: 30 }
        email: { type: ["string", "null"], format: email }
        entityType:
          oneOf:
            - $ref: "#/components/schemas/EntityType"
            - type: "null"
        businessName: { type: ["string", "null"], maxLength: 200 }
        businessEin: { type: ["string", "null"] }
        eAndOCarrier: { type: ["string", "null"], maxLength: 200 }
        eAndOPolicyNumber: { type: ["string", "null"], maxLength: 100 }
        eAndOExpiresOn:
          type: ["string", "null"]
          format: date

    PatchOnboardingProfileResponse:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/AgentContractingProfile"
      required: [profile]

    CarrierSelection:
      type: object
      properties:
        carrierId:
          type: string
          minLength: 1
        states:
          type: array
          minItems: 1
          maxItems: 56
          items:
            type: string
            minLength: 2
            maxLength: 2
      required: [carrierId, states]

    SelectCarriersBody:
      type: object
      properties:
        selections:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/CarrierSelection"
      required: [selections]

    SelectCarriersResponse:
      type: object
      properties:
        carrierRequests:
          type: array
          items:
            $ref: "#/components/schemas/CarrierContractingRequest"
      required: [carrierRequests]

    CancelOnboardingResponse:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/AgentOnboardingRun"
      required: [run]

    RequestContractingResponse:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/AgentOnboardingRun"
        paperworkGenerated: { type: integer }
        signTasks:
          type: array
          items:
            type: object
            properties:
              requestId: { type: string }
              taskId: { type: string }
            required: [requestId, taskId]
      required: [run, paperworkGenerated, signTasks]

    SignOnboardingCarrierResponse:
      type: object
      properties:
        envelopeId: { type: string }
        status:
          type: string
          enum: [pending, signed, completed, voided]
        signingUrl: { type: string }
        carrierContractingRequestId: { type: string }
      required: [envelopeId, status, signingUrl]

    PoaDecisionBody:
      type: object
      description: |
        Phase 1.5 POA decision body. `accepted: true` triggers POA PDF
        generation + envelope creation. `accepted: false` flips every
        draft carrier request to `invite_requested` and queues the
        invite-request emails to each carrier's appointment desk.
      properties:
        accepted: { type: boolean }
      required: [accepted]

    PoaDecisionResponse:
      type: object
      properties:
        poaStatus:
          $ref: "#/components/schemas/PoaStatus"
        envelopeId:
          type: ["string", "null"]
        signingUrl:
          type: ["string", "null"]
        transitioned:
          type: ["integer", "null"]
        idempotent:
          type: ["boolean", "null"]
      required: [poaStatus]

    RecordContractingDecisionBody:
      type: object
      description: |
        At least one of `writingNumber`, `status`, or `notes` must be set.
        When `writingNumber` is provided without an explicit `status`, the
        request is transitioned to `appointed`.
      properties:
        writingNumber:
          type: string
          maxLength: 64
        status:
          type: string
          enum: [appointed, rejected, submitted, under_review]
        notes:
          type: string
          maxLength: 2000

    RecordContractingDecisionResponse:
      type: object
      properties:
        request:
          $ref: "#/components/schemas/CarrierContractingRequest"
        idempotent: { type: boolean }
      required: [request, idempotent]

    # ---- E-sign ----------------------------------------------------------

    EnvelopeStatus:
      type: string
      enum: [pending, signed, completed, voided]

    EnvelopeSigner:
      type: object
      properties:
        userId:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 200
      required: [userId, displayName, email]

    EnvelopeConsentRecord:
      type: object
      properties:
        consentText: { type: string }
        version: { type: string }
        acceptedAt: { type: string, format: date-time }
        ipAddress:
          type: ["string", "null"]
        userAgent:
          type: ["string", "null"]
      required: [consentText, version, acceptedAt]

    Envelope:
      type: object
      properties:
        envelopeId: { type: string }
        status:
          $ref: "#/components/schemas/EnvelopeStatus"
        carrierContractingRequestId: { type: string }
        pdfDocumentId:
          type: string
          description: Document id of the unsigned PDF the wizard previews before signing.
        signers:
          type: array
          items:
            $ref: "#/components/schemas/EnvelopeSigner"
        signedAt:
          type: ["string", "null"]
          format: date-time
        signedPdfDocumentId:
          type: ["string", "null"]
        integritySha256:
          type: ["string", "null"]
        consentRecord:
          oneOf:
            - $ref: "#/components/schemas/EnvelopeConsentRecord"
            - type: "null"
      required:
        - envelopeId
        - status
        - carrierContractingRequestId
        - pdfDocumentId
        - signers

    CreateEsignEnvelopeBody:
      type: object
      properties:
        pdfDocumentId:
          type: string
          minLength: 1
        carrierContractingRequestId:
          type: string
          minLength: 1
        signers:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/EnvelopeSigner"
      required: [pdfDocumentId, carrierContractingRequestId, signers]

    CreateEsignEnvelopeResponse:
      type: object
      properties:
        envelopeId: { type: string }
        status:
          $ref: "#/components/schemas/EnvelopeStatus"
        signingUrl: { type: string }
      required: [envelopeId, status, signingUrl]

    SignEnvelopeBody:
      type: object
      description: |
        Server captures `req.ip` + `user-agent` itself; the frontend MUST NOT
        send these.
      properties:
        typedName:
          type: string
          minLength: 1
          maxLength: 200
        signatureSvg:
          type: string
          minLength: 1
          maxLength: 200000
        consentToElectronicBusiness:
          type: boolean
          enum: [true]
        intentToSign:
          type: boolean
          enum: [true]
      required:
        - typedName
        - signatureSvg
        - consentToElectronicBusiness
        - intentToSign

    SignEnvelopeResponse:
      type: object
      properties:
        envelopeId: { type: string }
        status:
          $ref: "#/components/schemas/EnvelopeStatus"
        signedPdfDocumentId: { type: string }
        integritySha256: { type: string }
      required:
        - envelopeId
        - status
        - signedPdfDocumentId
        - integritySha256

    VoidEnvelopeBody:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required: [reason]

    VoidEnvelopeResponse:
      type: object
      properties:
        envelopeId: { type: string }
        status:
          type: string
          enum: [voided]
      required: [envelopeId, status]

    DialerEventEnvelope:
      type: object
      description: |
        Dialer → agencyBRIDGE event envelope (spec §6). Additional/unknown
        properties are permitted and ignored by consumers (forward-compat,
        §6.2), hence `additionalProperties: true`.
      additionalProperties: true
      properties:
        eventId:
          type: string
          description: Unique event id; the receiver dedupes on this.
        schemaVersion:
          type: integer
          description: Envelope schema version (currently 1).
        type:
          type: string
          description: |
            Event type. Known values include call.initiated, call.ringing,
            call.in_progress, call.completed, call.failed,
            call.disposition.recorded, call.transcript.ready,
            call.transcript.purged, call.compliance.flagged. Unknown values
            are ignored.
        occurredAt:
          type: string
          format: date-time
        orgId:
          type: string
        dialTicketId:
          type: string
        dialerCallId:
          type: string
        data:
          type: object
          additionalProperties: true
      required:
        - eventId
        - type
        - orgId

    DialerEventAck:
      type: object
      properties:
        status:
          type: string
          enum: [accepted, ignored, duplicate]
        eventId:
          type: string
      required: [status, eventId]

    DialTicket:
      type: object
      description: |
        Minimal, time-boxed, pre-cleared Dial Ticket agencyBRIDGE provisions to
        the dialer (spec §5.1). The MBI is NEVER included (§3.1).
      properties:
        dialTicketId:
          type: string
          description: UUID correlation key across both systems.
        orgId: { type: string }
        agentId: { type: string }
        contactRef:
          type: string
          description: Opaque agencyBRIDGE contact id (never the MBI).
        callee: { $ref: "#/components/schemas/DialTicketCallee" }
        compliance: { $ref: "#/components/schemas/DialTicketCompliance" }
        campaignId: { type: string }
        callbackUrl:
          type: string
          format: uri
      required:
        - dialTicketId
        - orgId
        - agentId
        - contactRef
        - callee
        - compliance
        - callbackUrl

    DialTicketCallee:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone:
          type: string
          description: E.164.
        stateCode: { type: string }
        zipCode: { type: string }
        preferredLanguage: { type: string }
      required: [phone]

    DialTicketCompliance:
      type: object
      description: agencyBRIDGE's preclearance DECISION (not raw flags).
      properties:
        precleared: { type: boolean }
        preclearedAt: { type: string, format: date-time }
        preclearanceId: { type: string }
        tcpaConsentOnFile: { type: boolean }
        dncClear: { type: boolean }
        withinCallingHours: { type: boolean }
        soaRequired: { type: boolean }
        soaOnFile: { type: boolean }
        agentEligible: { type: boolean }
        expiresAt: { type: string, format: date-time }
      required:
        - precleared
        - preclearedAt
        - preclearanceId
        - expiresAt

    # --- stage2/new-pages-core ---
    KbArticleStage2:
      type: object
      properties:
        id: { type: string }
        orgId: { type: string }
        category: { type: string }
        title: { type: string }
        content: { type: string }
        keywords: { type: array, items: { type: string } }
        isActive: { type: boolean }
        createdBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, orgId, category, title, content, keywords, isActive, createdAt, updatedAt]
    KbArticleInputStage2:
      type: object
      properties:
        category: { type: string, maxLength: 80 }
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 20000 }
        keywords: { type: array, maxItems: 50, items: { type: string, maxLength: 60 } }
        isActive: { type: boolean }
    # --- stage2/campaigns ---
    CampaignAudience:
      type: object
      description: Audience filter over contacts. Health conditions and race are never filterable.
      additionalProperties: false
      properties:
        statuses: { type: array, items: { type: string, enum: [lead, prospect, enrolled, retained, lost] } }
        planTypes: { type: array, items: { type: string, enum: [MA, PDP, MAPD, supp, other] } }
        carrierIds: { type: array, items: { type: string } }
        states: { type: array, items: { type: string } }
        sources: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        birthdayMonth: { type: integer, minimum: 1, maximum: 12 }
    CampaignInput:
      type: object
      properties:
        channel: { type: string, enum: [email, sms] }
        name: { type: string }
        templateId: { type: [string, "null"] }
        subject: { type: [string, "null"] }
        body: { type: [string, "null"] }
        audience: { $ref: "#/components/schemas/CampaignAudience" }
    Campaign:
      type: object
      properties:
        id: { type: string }
        channel: { type: string, enum: [email, sms] }
        name: { type: string }
        status: { type: string, enum: [draft, scheduled, sending, sent, cancelled] }
        subject: { type: [string, "null"] }
        body: { type: [string, "null"] }
        audience: { $ref: "#/components/schemas/CampaignAudience" }
        templateName: { type: [string, "null"] }
        scheduledAt: { type: [string, "null"], format: date-time }
        sentAt: { type: [string, "null"], format: date-time }
        recipientCount: { type: integer }
        sentCount: { type: integer }
        deliveredCount: { type: integer }
        openedCount: { type: integer }
        clickedCount: { type: integer }
        bouncedCount: { type: integer }
        failedCount: { type: integer }
        skippedCount: { type: integer }
        unsubscribedCount: { type: integer }
    # --- end stage2/campaigns ---
    # --- native calling (Twilio Voice) ---
    StartCallBody:
      type: object
      additionalProperties: false
      required: [contactId]
      properties:
        contactId: { type: string }
        productLine: { type: string, enum: [MA, PDP, MAPD, supp, other] }
    StartCallResponse:
      type: object
      required: [callSessionId, to]
      properties:
        callSessionId: { type: string }
        to: { type: string, description: E.164 number derived server side from the contact }
    CallBlockReason:
      type: object
      required: [code, detail]
      properties:
        code:
          type: string
          enum:
            - AGENT_NOT_LICENSED
            - AGENT_LICENSE_EXPIRED
            - AGENT_NO_AHIP
            - AGENT_NOT_CERTIFIED
            - NO_CONSENT
            - DNC
            - OUTSIDE_CALLING_HOURS
            - TIMEZONE_UNRESOLVED
            - MISSING_INPUT
            - INVALID_NUMBER
            - AGENT_NOT_ELIGIBLE
            - MAX_ATTEMPTS_EXCEEDED
            - REDIAL_COOLDOWN
        detail: { type: string }
    CallBlockedResponse:
      type: object
      required: [error, reasons, callSessionId]
      properties:
        error: { type: string }
        code: { type: string }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/CallBlockReason" }
        callSessionId: { type: string }
    CallingUnavailable:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [needs_setup, demo_mode] }
        missing:
          type: array
          description: Names (never values) of the Twilio env vars that are not set
          items: { type: string }
        error: { type: string }
    VoiceToken:
      type: object
      required: [token, identity, expiresAt, ttlSeconds]
      properties:
        token: { type: string }
        identity: { type: string }
        expiresAt: { type: string, format: date-time }
        ttlSeconds: { type: integer }
    CallSession:
      type: object
      properties:
        id: { type: string }
        contactId: { type: [string, "null"] }
        userId: { type: [string, "null"] }
        direction: { type: string }
        status:
          type: string
          enum: [initiated, ringing, in_progress, completed, busy, no_answer, failed, canceled, blocked]
        toNumber: { type: string }
        startedAt: { type: [string, "null"], format: date-time }
        answeredAt: { type: [string, "null"], format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        durationSeconds: { type: [integer, "null"] }
        dispositionCode: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        blockedReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
    CallSessionList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CallSession" }
        total: { type: integer }
    UpdateCallBody:
      type: object
      additionalProperties: false
      properties:
        dispositionCode:
          type: string
          enum: [POSITIVE, NEUTRAL, NEGATIVE, COMPLIANCE, FOLLOW_UP, UNKNOWN, DO_NOT_CALL]
        notes: { type: [string, "null"], maxLength: 2000 }
    UpdateCallResponse:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        dispositionCode: { type: [string, "null"] }
        notes: { type: [string, "null"] }
    # --- end native calling ---
