  # ---- Onboarding (agent contracting wizard) -------------------------------

  /onboarding/start:
    post:
      operationId: startOnboarding
      tags: [onboarding]
      summary: Start (or invite) an onboarding run for an agent
      description: |
        Admin starts an onboarding run. Idempotent on `(org_id, agent_id)`
        — re-posting returns the existing active run with `idempotent: true`
        rather than 409'ing.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartOnboardingBody"
      responses:
        "200":
          description: Existing run (idempotent re-post)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartOnboardingResponse"
        "201":
          description: New run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartOnboardingResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Agent not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /onboarding:
    get:
      operationId: listOnboardings
      tags: [onboarding]
      summary: List onboarding runs (admin)
      security:
        - cookieAuth: []
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Paginated list of onboarding runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /onboarding/{agentId}:
    get:
      operationId: getOnboarding
      tags: [onboarding]
      summary: Get current onboarding run + profile + carrier requests for an agent
      security:
        - cookieAuth: []
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Current onboarding detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No active onboarding run for the agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /onboarding/{agentId}/profile:
    patch:
      operationId: patchOnboardingProfile
      tags: [onboarding]
      summary: Update the agent's contracting profile
      description: |
        Agent (or admin on behalf of) updates the contracting profile.
        SSN + EIN are AES-256-GCM-encrypted before write; plaintext never
        lands in the database. Auto-advances the run from `draft` →
        `profile_in_progress`.
      security:
        - cookieAuth: []
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchOnboardingProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchOnboardingProfileResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Agent / profile not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /onboarding/{agentId}/carriers/select:
    post:
      operationId: selectOnboardingCarriers
      tags: [onboarding]
      summary: Pick carriers + states for an onboarding run
      security:
        - cookieAuth: []
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectCarriersBody"
      responses:
        "201":
          description: Created (or upserted) carrier contracting requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectCarriersResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Agent not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /onboarding/{agentId}/cancel:
    post:
      operationId: cancelOnboarding
      tags: [onboarding]
      summary: Cancel the active onboarding run for an agent
      security:
        - cookieAuth: []
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cancelled run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelOnboardingResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Agent / run not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Invalid state transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /onboarding/{agentId}/request-contracting:
    post:
      operationId: requestContracting
      tags: [onboarding]
      summary: Generate carrier paperwork + create sign tasks (admin)
      security:
        - cookieAuth: []
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Paperwork generation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestContractingResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Agent / run not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: No carrier requests on this run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /onboarding/{agentId}/poa-decision:
    post:
      operationId: recordPoaDecision
      tags: [onboarding]
      summary: Record the agent's Power-of-Attorney decision
      description: |
        Phase 1.5 — agent either accepts the run-wide POA (INSUREitALL
        submits contracts on their behalf) or declines it (carriers email
        the agent invitations to complete each contracting flow directly).
        Idempotent on the run.
      security:
        - cookieAuth: []
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoaDecisionBody"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoaDecisionResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller is neither the owning agent nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Agent / run not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: No carriers selected on the run yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /onboarding/{agentId}/carriers/{requestId}/sign:
    post:
      operationId: signOnboardingCarrier
      tags: [onboarding]
      summary: Start a signing envelope for a carrier contracting request
      description: |
        `requestId` is the *carrier id* on the contracting request — the route
        looks the request up by `(run, carrierId)`. Returns an e-sign envelope
        id + signing URL the wizard navigates the agent to. Idempotent.
      security:
        - cookieAuth: []
      parameters:
        - { name: agentId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Envelope created (or existing envelope returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOnboardingCarrierResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller is neither the owning agent nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Agent / run / request not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Paperwork not yet generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/contracting/{requestId}:
    patch:
      operationId: recordCarrierContractingDecision
      tags: [onboarding]
      summary: Record carrier writing-number / appointment decision (admin)
      security:
        - cookieAuth: []
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordContractingDecisionBody"
      responses:
        "200":
          description: Updated carrier contracting request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordContractingDecisionResponse"
        "400":
          description: Invalid body or forbidden state transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Contracting request not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---- E-signature ---------------------------------------------------------

  /esign/envelopes:
    post:
      operationId: createEsignEnvelope
      tags: [esign]
      summary: Create an e-sign envelope for a carrier contracting request
      description: |
        Idempotent on `(org, carrier_contracting_request_id)` while not
        voided — re-posting returns the existing envelope rather than 409'ing.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEsignEnvelopeBody"
      responses:
        "201":
          description: Envelope created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEsignEnvelopeResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Forbidden role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Provider failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /esign/envelopes/{envelopeId}:
    get:
      operationId: getEsignEnvelope
      tags: [esign]
      summary: Fetch an e-sign envelope by id
      security:
        - cookieAuth: []
      parameters:
        - { name: envelopeId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Envelope state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Envelope not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /esign/envelopes/{envelopeId}/sign:
    post:
      operationId: signEsignEnvelope
      tags: [esign]
      summary: Record a signature on an e-sign envelope
      description: |
        Server captures `req.ip` + `user-agent` itself — the frontend MUST NOT
        send these in the body. Only the signer-userId on the envelope OR
        a `super_admin` / `agency_admin` may sign.
      security:
        - cookieAuth: []
      parameters:
        - { name: envelopeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignEnvelopeBody"
      responses:
        "200":
          description: Signature recorded; signed PDF persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignEnvelopeResponse"
        "400":
          description: Invalid body / consent not granted / invalid signature input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller is not the signer and not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Envelope not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Envelope state forbids signing (e.g. already completed / voided)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /esign/envelopes/{envelopeId}/void:
    post:
      operationId: voidEsignEnvelope
      tags: [esign]
      summary: Void an e-sign envelope (admin only)
      security:
        - cookieAuth: []
      parameters:
        - { name: envelopeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidEnvelopeBody"
      responses:
        "200":
          description: Envelope voided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidEnvelopeResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller is not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Envelope not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Envelope state forbids voiding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /esign/envelopes/{envelopeId}/signed-pdf:
    get:
      operationId: getEsignSignedPdf
      tags: [esign]
      summary: Download the signed PDF for a completed envelope
      security:
        - cookieAuth: []
      parameters:
        - { name: envelopeId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Signed PDF bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Envelope not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Envelope is not yet completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /dialer/v1/events:
    post:
      tags: [dialer]
      summary: Inbound masterBRIDGE dialer lifecycle event (HMAC-signed webhook)
      description: |
        Receives Dialer → agencyBRIDGE lifecycle events (spec §6). Authenticated
        by the `X-MB-Signature` HMAC (not a Clerk session). Idempotent on
        `eventId`; duplicate / out-of-order deliveries are deduped. Unknown
        event `type` values and unknown fields are ignored (forward-compat,
        §6.2). Every event lands in the agencyBRIDGE audit log.
      security:
        - mbWebhookSignature: []
      parameters:
        - name: X-MB-Signature
          in: header
          required: true
          description: "t=<unixSeconds>,v1=<hex HMAC-SHA256 of `${t}.${rawBody}`>"
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DialerEventEnvelope" }
      responses:
        "200":
          description: Event accepted, ignored (unknown type), or deduped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DialerEventAck" }
        "400":
          description: Invalid event envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing / invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Stale signature timestamp (outside ±5 min)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --- stage2/new-pages-core ---
  # Book of business, reconciliation, agent back office, CSV exports and the
  # Knowledge Base. Pages call these through customFetch; no generated hooks.
  /enrollments/summary:
    get:
      operationId: getEnrollmentsSummary
      tags: [enrollments]
      summary: Book-of-business counts (same filters as GET /enrollments)
      description: Requires contact:read. Org-scoped.
      parameters:
        - { name: carrierId, in: query, schema: { type: string } }
        - { name: agentId, in: query, schema: { type: string } }
        - { name: planType, in: query, schema: { type: string, enum: [MA, PDP, MAPD, supp, other] } }
        - { name: status, in: query, schema: { type: string } }
        - { name: effectuated, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: effectiveFrom, in: query, schema: { type: string, format: date } }
        - { name: effectiveTo, in: query, schema: { type: string, format: date } }
        - { name: search, in: query, description: Client name or policy number, schema: { type: string } }
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  active: { type: integer }
                  pending: { type: integer }
                  ended: { type: integer }
                  effectuated: { type: integer }
                  notEffectuated: { type: integer }
                  startingSoon: { type: integer, description: Effective date within the next 60 days }
  /commissions/reconciliation/overview:
    get:
      operationId: getReconciliationOverview
      tags: [commissions]
      summary: Statement variance, unmatched line items and open missed payments
      description: Requires commission:read. Org-scoped. Never returns carrier member ids.
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  statements: { type: array, items: { type: object, additionalProperties: true } }
                  totals: { type: object, additionalProperties: true }
                  unmatchedItems: { type: array, items: { type: object, additionalProperties: true } }
                  missedPayments: { type: array, items: { type: object, additionalProperties: true } }
                  asOf: { type: string, format: date-time }
  /agents/me/backoffice:
    get:
      operationId: getMyAgentBackoffice
      tags: [agents]
      summary: The caller's own agent back office
      description: Any authenticated user with a linked agent record. 404 when none is linked.
      responses:
        "200":
          description: Back office
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404":
          description: No agent linked to this user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /agents/{id}/backoffice:
    get:
      operationId: getAgentBackoffice
      tags: [agents]
      summary: One agent's back office (profile, readiness, AHIP, licenses, certifications, portals, tasks, documents, checklists)
      description: Requires agent:read. Org-scoped.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Back office
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404":
          description: Agent not found in this org
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /reports/contacts/export:
    get:
      operationId: exportContactsCsv
      tags: [reports]
      summary: Every contact as CSV
      description: |
        Requires contact:update, a recent sign-in and `X-Confirm-Export: true`.
        Medicare ID is decrypted only for PHI-privileged roles and masked
        otherwise (same as the contacts bulk export). Logged to data_export_log.
      parameters:
        - { name: X-Confirm-Export, in: header, required: true, schema: { type: string, enum: ["true"] } }
      responses:
        "200": { description: CSV file, content: { text/csv: { schema: { type: string } } } }
        "428": { description: Export confirmation header missing }
  /reports/policies/export:
    get:
      operationId: exportPoliciesCsv
      tags: [reports]
      summary: Every enrollment (policy) as CSV — no Medicare ID column
      description: Requires contact:update, a recent sign-in and `X-Confirm-Export true`. Logged to data_export_log.
      parameters:
        - { name: X-Confirm-Export, in: header, required: true, schema: { type: string, enum: ["true"] } }
      responses:
        "200": { description: CSV file, content: { text/csv: { schema: { type: string } } } }
        "428": { description: Export confirmation header missing }
  /reports/agents/export:
    get:
      operationId: exportAgentsCsv
      tags: [reports]
      summary: Agent roster as CSV — no contracting PII
      description: Requires agent:update, a recent sign-in and `X-Confirm-Export true`. Logged to data_export_log.
      parameters:
        - { name: X-Confirm-Export, in: header, required: true, schema: { type: string, enum: ["true"] } }
      responses:
        "200": { description: CSV file, content: { text/csv: { schema: { type: string } } } }
        "428": { description: Export confirmation header missing }
  /kb/articles:
    get:
      operationId: listKbArticles
      tags: [knowledge-base]
      summary: List Knowledge Base articles (all staff roles)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: includeInactive, in: query, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: Articles and org-wide counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  articles: { type: array, items: { $ref: "#/components/schemas/KbArticleStage2" } }
                  stats:
                    type: object
                    properties:
                      total: { type: integer }
                      active: { type: integer }
                      categories: { type: integer }
                      keywords: { type: integer }
    post:
      operationId: createKbArticle
      tags: [knowledge-base]
      summary: Create an article (super_admin, agency_admin). Never include client data.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KbArticleInputStage2" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbArticleStage2" }
  /kb/articles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getKbArticle
      tags: [knowledge-base]
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbArticleStage2" }
        "404": { description: Not found in this org }
    patch:
      operationId: updateKbArticle
      tags: [knowledge-base]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KbArticleInputStage2" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KbArticleStage2" }
        "404": { description: Not found in this org }
    delete:
      operationId: deleteKbArticle
      tags: [knowledge-base]
      responses:
        "204": { description: Deleted }
        "404": { description: Not found in this org }
  # --- stage2/calendar-branding ---
  # Calendar appointments, agency white-label branding and super_admin
  # workspace provisioning. Schemas are inline so this block stays contiguous.
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: Appointments starting in [from, to) (max 100 days). Agents see only their own.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: agentId, in: query, schema: { type: string } }
        - { name: contactId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [confirmed, pending, completed, cancelled, no_show] } }
      responses:
        "200":
          description: Appointments plus status counts for the range
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object, additionalProperties: true } }
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      confirmed: { type: integer }
                      pending: { type: integer }
                      completed: { type: integer }
                      cancelled: { type: integer }
                      no_show: { type: integer }
                  scope: { type: string, enum: [own, org] }
        "400": { description: Missing or oversized range, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Book an appointment (notes are encrypted at rest)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startsAt, endsAt]
              properties:
                title: { type: string, maxLength: 200 }
                type: { type: string, enum: [enrollment, review, renewal, consultation, other] }
                status: { type: string, enum: [confirmed, pending, completed, cancelled, no_show] }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                contactId: { type: [string, "null"] }
                agentId: { type: [string, "null"] }
                notes: { type: [string, "null"], maxLength: 4000 }
                locationType: { type: string, enum: [office, phone, video, home] }
                locationDetail: { type: [string, "null"], maxLength: 300 }
                meetingUrl: { type: [string, "null"], description: "https:// only" }
      responses:
        "201": { description: Created appointment, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Not permitted (agents book only their own calendar and contacts), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /appointments/contact-options:
    get:
      operationId: listAppointmentContactOptions
      tags: [appointments]
      summary: Contact picker (names only). Agents get only contacts assigned to them.
      parameters:
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        firstName: { type: string }
                        lastName: { type: string }
                        assignedAgentId: { type: [string, "null"] }
  /appointments/agent-options:
    get:
      operationId: listAppointmentAgentOptions
      tags: [appointments]
      summary: Agent picker. Agents get only themselves.
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        firstName: { type: string }
                        lastName: { type: string }
                        isMe: { type: boolean }
  /appointments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: One appointment
      responses:
        "200": { description: Appointment, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { description: Not found (or not yours), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Edit or reschedule (rescheduling clears the reminder claim)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Updated appointment, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { description: Not found (or not yours), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Delete an appointment
      responses:
        "204": { description: Deleted }
        "404": { description: Not found (or not yours), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /organizations/me/branding:
    get:
      operationId: getOrgBranding
      tags: [organizations]
      summary: This agency's white-label settings (null = agencyBRIDGE default). Any member.
      responses:
        "200": { description: Branding, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    put:
      operationId: updateOrgBranding
      tags: [organizations]
      summary: Update branding (agency_admin / super_admin). Rejects colours under 3:1 contrast on white.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                productName: { type: [string, "null"], maxLength: 40 }
                tagline: { type: [string, "null"], maxLength: 80 }
                primaryColor: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
                accentColor: { type: [string, "null"], pattern: "^#[0-9a-fA-F]{6}$" }
                displayFont: { type: [string, "null"] }
                bodyFont: { type: [string, "null"] }
                logoUrl: { type: [string, "null"] }
                markUrl: { type: [string, "null"] }
                faviconUrl: { type: [string, "null"] }
                emailFromName: { type: [string, "null"], maxLength: 60 }
      responses:
        "200": { description: Saved branding plus contrast warnings, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { description: Invalid value or low contrast (code low_contrast), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: resetOrgBranding
      tags: [organizations]
      summary: Reset to the agencyBRIDGE defaults (also clears the logo)
      responses:
        "200": { description: Default branding, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /admin/agencies/overview:
    get:
      operationId: listAgenciesOverview
      tags: [admin]
      summary: Every agency with live member, agent, client and pending-invitation counts (super_admin)
      responses:
        "200": { description: Agencies, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "403": { description: Not super_admin, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/agencies:
    post:
      operationId: createAgency
      tags: [admin]
      summary: Create an agency and invite its first admin via the invitation flow (super_admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, adminEmail]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                slug: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{1,46}[a-z0-9])$" }
                adminEmail: { type: string, format: email }
      responses:
        "201": { description: "Agency, invitation and one-time accept link", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "409": { description: Slug taken or address already has an account, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: APP_BASE_URL not configured, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  # --- end stage2/calendar-branding ---

  # --- stage2/campaigns ---
  # Omnichannel email/SMS campaigns (routes/campaigns.ts, routes/campaignsPublic.ts).
  # The web page calls these with customFetch; no generated hooks are required.
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns for the org (optionally one channel)
      parameters:
        - { name: channel, in: query, required: false, schema: { type: string, enum: [email, sms] } }
      responses:
        "200": { description: Campaigns, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Campaign" } } } } }
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a draft campaign (communication:create)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CampaignInput" } } }
      responses:
        "201": { description: Draft created, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "400": { description: Invalid body, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /campaigns/overview:
    get:
      operationId: getCampaignOverview
      tags: [campaigns]
      summary: KPI totals from real recipient rows; rates are null until tracking is connected
      parameters:
        - { name: channel, in: query, required: false, schema: { type: string, enum: [email, sms] } }
      responses:
        "200": { description: Totals, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /campaigns/config:
    get:
      operationId: getCampaignConfig
      tags: [campaigns]
      summary: Which sending / tracking / compliance settings are configured
      responses:
        "200": { description: Config state, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /campaigns/settings:
    put:
      operationId: updateCampaignSettings
      tags: [campaigns]
      summary: Sender name, physical mailing address (CAN-SPAM), reply-to, quiet-hours time zone (communication:update)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                senderName: { type: [string, "null"] }
                physicalAddress: { type: [string, "null"] }
                replyToEmail: { type: [string, "null"] }
                defaultTimeZone: { type: string }
      responses:
        "200": { description: Updated config state, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /campaigns/activity:
    get:
      operationId: getCampaignActivity
      tags: [campaigns]
      summary: Recent delivered / opened / clicked / bounced / unsubscribed recipient events
      parameters:
        - { name: channel, in: query, required: false, schema: { type: string, enum: [email, sms] } }
      responses:
        "200": { description: Events, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /campaigns/audience/preview:
    post:
      operationId: previewCampaignAudience
      tags: [campaigns]
      summary: Live recipient count for an audience filter (opt-outs excluded)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [email, sms] }
                audience: { $ref: "#/components/schemas/CampaignAudience" }
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  matched: { type: integer }
                  eligible: { type: integer }
                  optedOut: { type: integer }
                  missingAddress: { type: integer }
  /campaigns/audience/options:
    get:
      operationId: getCampaignAudienceOptions
      tags: [campaigns]
      summary: Distinct states, sources, tags and carriers for the audience builder
      responses:
        "200": { description: Options, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /campaigns/opt-outs:
    get:
      operationId: listCampaignOptOuts
      tags: [campaigns]
      summary: Email unsubscribes or the SMS STOP list for the org
      parameters:
        - { name: channel, in: query, required: false, schema: { type: string, enum: [email, sms] } }
      responses:
        "200": { description: Opt-outs, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /campaigns/opt-outs/{channel}/resubscribe:
    post:
      operationId: resubscribeCampaignContact
      tags: [campaigns]
      summary: Re-opt-in a contact to EMAIL with explicit confirmation + reason (audited). SMS always 403 — only the consumer texting START can re-opt-in.
      parameters:
        - { name: channel, in: path, required: true, schema: { type: string, enum: [email, sms] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contactId, confirm, reason]
              properties:
                contactId: { type: string }
                confirm: { type: boolean, const: true }
                reason: { type: string, minLength: 5 }
      responses:
        "200": { description: Re-subscribed }
        "403": { description: SMS re-opt-in is never allowed from the UI }
  /campaigns/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Campaign detail with up to 200 recipients
      responses:
        "200": { description: Campaign, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "404": { description: Not found in this org }
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Edit a draft
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CampaignInput" } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "409": { description: Not a draft }
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a draft or a cancelled campaign that reached nobody (communication:update)
      responses:
        "204": { description: Deleted }
        "409": { description: Sent campaigns are kept as a record }
  /campaigns/{id}/send:
    post:
      operationId: sendCampaign
      tags: [campaigns]
      summary: Send now or schedule (communication:update). 409 when the provider, mailing address or unsubscribe signer is not configured, or the audience is empty.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduledAt: { type: [string, "null"], format: date-time }
      responses:
        "200": { description: Scheduled, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "409": { description: Not configured / empty audience / not a draft }
  /campaigns/{id}/cancel:
    post:
      operationId: cancelCampaign
      tags: [campaigns]
      summary: Cancel a scheduled or sending campaign
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
  /campaigns/v1/webhooks/resend:
    post:
      operationId: campaignResendWebhook
      tags: [campaigns]
      security: []
      summary: Resend delivery/open/click/bounce/complaint events (svix signature, RESEND_WEBHOOK_SECRET)
      responses:
        "200": { description: Accepted (or duplicate) }
        "401": { description: Bad signature }
        "503": { description: RESEND_WEBHOOK_SECRET not configured }
  /campaigns/v1/webhooks/twilio-status:
    post:
      operationId: campaignTwilioStatusCallback
      tags: [campaigns]
      security: []
      summary: Twilio SMS delivery receipts (X-Twilio-Signature)
      responses:
        "204": { description: Accepted }
        "403": { description: Bad signature }
  # --- end stage2/campaigns ---

  # --- native calling (Twilio Voice) ---
  # routes/softphone.ts + routes/voiceWebhooks.ts. The browser NEVER supplies a
  # phone number: a call is started from a contact id, the number is derived and
  # stored server side, and the Voice webhook dials only the stored number.
  /softphone/calls:
    post:
      operationId: startSoftphoneCall
      tags: [calling]
      summary: Preclear a call to a contact and create a single-use call session
      description: |
        Runs preclearance (consent, do-not-contact across orgs, calling hours in
        the contact's timezone, agent eligibility) plus attempt-limit and redial
        cooldown backstops. A refused call returns 409 with the specific reasons
        and stores a `blocked` call session as an audit trail. The `agent` role
        may call only contacts assigned to their own agent profile.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCallBody"
      responses:
        "201":
          description: Call session created; pass callSessionId (and `to`) as Device.connect params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartCallResponse"
        "400": { description: Invalid body (a phone number field is rejected), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Contact not found or not callable by this user, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: Refused by preclearance or a dial backstop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallBlockedResponse"
        "503":
          description: Twilio Voice not configured (needs_setup) or demo mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingUnavailable"
    get:
      operationId: listSoftphoneCalls
      tags: [calling]
      summary: Recent call sessions (agents see only their own)
      security:
        - cookieAuth: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 15 } }
        - { name: contactId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Call sessions, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSessionList"
  /softphone/calls/{id}:
    patch:
      operationId: updateSoftphoneCall
      tags: [calling]
      summary: Save disposition and notes on a call (owner or admin only)
      description: |
        A DO_NOT_CALL disposition also records an opt-out for the number, which
        blocks further calls and texts to it.
      security:
        - cookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCallBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCallResponse"
        "400": { description: Invalid body, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Call not found (or not yours), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: A blocked call cannot be dispositioned, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /softphone/voice-token:
    get:
      operationId: getSoftphoneVoiceToken
      tags: [calling]
      summary: Mint a short-lived Twilio Voice access token for the signed-in user
      description: |
        HS256 JWT with a VoiceGrant (outgoing through our TwiML App only),
        identity = the user id, TTL at most 10 minutes. Returns 503 with
        `status: needs_setup` and the names of the missing env vars until Twilio
        is configured.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceToken"
        "503":
          description: Needs setup (missing env var names) or demo mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingUnavailable"
  /webhooks/twilio/voice:
    post:
      operationId: twilioVoiceWebhook
      tags: [calling]
      security: []
      summary: TwiML App Voice URL (X-Twilio-Signature). Dials only the number stored on the call session.
      description: |
        Rejects (TwiML `<Reject>`) unless the session is `initiated`, under 2
        minutes old, bound to the calling user, the echoed `To` matches the
        stored number and the number still clears the opt-out check. Recording
        stays off unless the session has `recording_enabled`.
      responses:
        "200": { description: TwiML (Dial or Reject), content: { text/xml: { schema: { type: string } } } }
        "403": { description: Bad signature }
  /webhooks/twilio/voice-status:
    post:
      operationId: twilioVoiceStatusCallback
      tags: [calling]
      security: []
      summary: Call status and Dial results (X-Twilio-Signature). Idempotent; logs the call once.
      responses:
        "200": { description: Accepted (or duplicate), content: { text/xml: { schema: { type: string } } } }
        "403": { description: Bad signature }
  /webhooks/twilio/voice-notice:
    post:
      operationId: twilioVoiceRecordingNotice
      tags: [calling]
      security: []
      summary: Recording notice played to the callee before bridging (X-Twilio-Signature)
      responses:
        "200": { description: TwiML notice, content: { text/xml: { schema: { type: string } } } }
        "403": { description: Bad signature }
  # --- end native calling ---


components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __session
      description: |
        Clerk session cookie. Every route under `/api` requires an active
        authenticated session; routes that need a particular role return
        403 once authenticated. The healthcheck (`/healthz`) is the only
        public endpoint.
    mbWebhookSignature:
      type: apiKey
      in: header
      name: X-MB-Signature
      description: |
        Per-tenant HMAC-SHA256 webhook signature (spec §4.2). Format
        `t=<unixSeconds>,v1=<hex>`; the HMAC is over `${t}.${rawBody}` keyed
        with the org's shared secret, timestamp-bound to ±5 min (replay
        protection).
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    User:
      type: object
      properties:
        id:
          type: string
        orgId:
          type: string
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [super_admin, agency_admin, compliance_manager, agent_support, viewer, agent]
        avatarUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - orgId
        - email
        - fullName
        - role
        - isActive
        - createdAt
        - updatedAt

    UpdateUserBody:
      type: object
      properties:
        fullName:
          type: string
        avatarUrl:
          type: string

    UpdateUserRoleBody:
      type: object
      properties:
        role:
          type: string
          enum: [super_admin, agency_admin, compliance_manager, agent_support, viewer, agent]
      required:
        - role

    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        planTier:
          type: string
          description: >
            The plan the product actually enforces (from the subscription /
            entitlements — the same tier /billing/subscription reports), not
            the legacy organizations.plan_tier column.
        logoUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - planTier
        - createdAt

    UpdateOrganizationBody:
      type: object
      properties:
        name:
          type: string
        logoUrl:
          type: string

    DashboardStats:
      type: object
      properties:
        totalAgents:
          type: integer
        agentsByStatus:
          type: object
          properties:
            onboarding:
              type: integer
            active:
              type: integer
            suspended:
              type: integer
            offboarding:
              type: integer
            offboarded:
              type: integer
          required:
            - onboarding
            - active
            - suspended
            - offboarding
            - offboarded
        licensesExpiringIn30Days:
          type: integer
        licensesExpiringIn60Days:
          type: integer
        licensesExpiringIn90Days:
          type: integer
        openTasksCount:
          type: integer
        overdueTasks:
          type: integer
        openLeadsCount:
          type: integer
          description: >
            CRM contacts whose status is Lead (not deleted) — the same number
            the Clients & Leads page shows. Not the inbound queue's `leads` table.
        unreadNotificationsCount:
          type: integer
        ahipCompletionRateCurrent:
          type: number
          description: >
            Percent of agents who need AHIP (status active or onboarding) with
            a passed or waived record for ahipPlanYear.
        ahipCompleteCount:
          type: integer
        agentsRequiringAhip:
          type: integer
        licensesExpiredCount:
          type: integer
          description: >
            Licenses past their expiry date (or stored as expired) for agents
            still on the team (onboarding, active, suspended).
        ahipPlanYear:
          type: integer
          description: Plan year being sold today — the calendar year through Sept 30, the next year from Oct 1.
        totalContacts:
          type: integer
        agentsWithExpiringLicenses:
          type: array
          items:
            $ref: "#/components/schemas/AgentLicenseAlert"
      required:
        - totalAgents
        - agentsByStatus
        - licensesExpiringIn30Days
        - licensesExpiringIn60Days
        - licensesExpiringIn90Days
        - openTasksCount
        - overdueTasks
        - openLeadsCount
        - unreadNotificationsCount
        - ahipCompletionRateCurrent
        - totalContacts
        - agentsWithExpiringLicenses

    AgentLicenseAlert:
      type: object
      properties:
        agentId:
          type: string
        agentName:
          type: string
        stateCode:
          type: string
        licenseType:
          type: string
        expiryDate:
          type: string
          format: date-time
        daysUntilExpiry:
          type: integer
      required:
        - agentId
        - agentName
        - stateCode
        - licenseType
        - expiryDate
        - daysUntilExpiry

    ActivityItem:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        userId:
          type: ["string", "null"]
        userFullName:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
          description: The client the activity is about; null unless the caller has contact:read.
        resourceType:
          type: ["string", "null"]
        resourceId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - title
        - createdAt

    MyAgent:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
          enum: [onboarding, active, suspended, offboarding, offboarded]
      required:
        - id
        - firstName
        - lastName
        - status

    Agent:
      type: object
      properties:
        id:
          type: string
        orgId:
          type: string
        userId:
          type: ["string", "null"]
        npn:
          type: ["string", "null"]
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [onboarding, active, suspended, offboarding, offboarded]
        hireDate:
          type: ["string", "null"]
          format: date-time
        offboardDate:
          type: ["string", "null"]
          format: date-time
        managerId:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        activeLicenseCount:
          type: integer
          description: Number of active state licenses (populated in list endpoint)
      required:
        - id
        - orgId
        - firstName
        - lastName
        - email
        - status
        - createdAt
        - updatedAt

    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          properties:
            manager:
