openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Medicare Agency Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile and management
  - name: organizations
    description: Organization settings
  - name: dashboard
    description: Dashboard metrics and activity
  - name: agents
    description: Agent lifecycle management
  - name: licenses
    description: State license management
  - name: certifications
    description: Carrier certification management
  - name: ahip
    description: AHIP annual certification
  - name: carriers
    description: Carrier management
  - name: checklists
    description: Onboarding and offboarding checklists
  - name: techstack
    description: Tech stack accounts and platform requirements
  - name: tasks
    description: Task management
  - name: documents
    description: Document storage
  - name: renewals
    description: License and certification renewal alerts
  - name: notifications
    description: Notification management
  - name: audit
    description: Audit log and compliance
  - name: storage
    description: Object storage uploads
  - name: settings
    description: Organization settings
  - name: contacts
    description: CRM contact management
  - name: leads
    description: Lead management and conversion
  - name: pipelines
    description: Sales pipeline and deal management
  - name: communications
    description: Two-way SMS and email threads
  - name: templates
    description: SMS and email template library
  - name: sequences
    description: Drip sequence builder and enrollment
  - name: retention
    description: Medicare-specific retention tools
  - name: automations
    description: Automation rules engine
  - name: ai
    description: AI assistant, outreach drafting, and compliance reports
  - name: reports
    description: Analytics and performance reporting
  - name: admin
    description: HIPAA/SOC 2 compliance administration
  - name: imports
    description: Data migration importers (Monday.com, GoHighLevel, CSV)
  - name: onboarding
    description: Agent contracting/onboarding wizard flows
  - name: esign
    description: Native e-signature envelopes for carrier contracting paperwork
  - name: dialer
    description: masterBRIDGE dialer integration — inbound lifecycle events (Option A)
  # --- stage2/campaigns ---
  - name: campaigns
    description: Omnichannel email/SMS marketing campaigns
  - name: calling
    description: Native browser calling on Twilio Voice (call sessions, access token, TwiML webhooks)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List all users (admin only)
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

  /users/{userId}/role:
    patch:
      operationId: updateUserRole
      tags: [users]
      summary: Update a user's role (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /organizations/me:
    get:
      operationId: getMyOrganization
      tags: [organizations]
      summary: Get current organization
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
    patch:
      operationId: updateMyOrganization
      tags: [organizations]
      summary: Update organization settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationBody"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard aggregate statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /agents:
    get:
      operationId: getAgents
      tags: [agents]
      summary: List agents
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: managerId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, email, status, hireDate, licenseCount, complianceScore]
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentBody"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/me:
    get:
      operationId: getMyAgent
      tags: [agents]
      summary: The caller's own agent profile (agent role only)
      description: |
        Self lookup for the `agent` role, which has no `agent:read`. Resolved
        by the authenticated user within their own org. 404 when the user has
        no linked agent profile; 403 for any other role.
      responses:
        "200":
          description: The caller's agent profile (minimal fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAgent"
        "404":
          description: No agent profile is linked to this user

  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get agent by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentBody"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /agents/{id}/compliance-score:
    get:
      operationId: getAgentComplianceScore
      tags: [agents]
      summary: Get agent compliance score
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compliance score breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceScore"

  /agents/{id}/offboarding-report:
    get:
      operationId: getAgentOffboardingReport
      tags: [agents]
      summary: Get generated offboarding report document metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Offboarding report metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OffboardingReportDocument"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /agents/{id}/offboard:
    post:
      operationId: offboardAgent
      tags: [agents]
      summary: Trigger agent offboarding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Offboarding initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OffboardResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already offboarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /agents/{id}/licenses:
    get:
      operationId: getAgentLicenses
      tags: [licenses]
      summary: List licenses for an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated license list for an agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateLicenseListResponse"
    post:
      operationId: createAgentLicense
      tags: [licenses]
      summary: Add a state license to an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLicenseBody"
      responses:
        "201":
          description: Created license
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateLicense"

  /agents/{id}/licenses/{lid}/alerts:
    get:
      operationId: getLicenseRenewalAlerts
      tags: [licenses]
      summary: Get renewal alert history for a specific license
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of sent renewal alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LicenseRenewalAlert"

  /licenses/bulk-import:
    post:
      operationId: bulkImportLicenses
      tags: [licenses]
      summary: Bulk import licenses from CSV rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportLicensesBody"
      responses:
        "200":
          description: Import results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"
        "400":
          description: Invalid request

  /agents/{id}/licenses/{lid}:
    patch:
      operationId: updateAgentLicense
      tags: [licenses]
      summary: Update a state license
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLicenseBody"
      responses:
        "200":
          description: Updated license
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateLicense"
    delete:
      operationId: deleteAgentLicense
      tags: [licenses]
      summary: Delete a state license
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /agents/{id}/certifications:
    get:
      operationId: getAgentCertifications
      tags: [certifications]
      summary: List carrier certifications for an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of certifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarrierCertification"
    post:
      operationId: createAgentCertification
      tags: [certifications]
      summary: Add a carrier certification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificationBody"
      responses:
        "201":
          description: Created certification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarrierCertification"

  /agents/{id}/certifications/{cid}:
    patch:
      operationId: updateAgentCertification
      tags: [certifications]
      summary: Update a carrier certification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCertificationBody"
      responses:
        "200":
          description: Updated certification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarrierCertification"
    delete:
      operationId: deleteAgentCertification
      tags: [certifications]
      summary: Delete a carrier certification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /certifications/matrix:
    get:
      operationId: getCertificationMatrix
      tags: [certifications]
      summary: Get agency-wide certification matrix
      parameters:
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Certification matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificationMatrix"

  /agents/{id}/ahip:
    get:
      operationId: getAgentAhip
      tags: [ahip]
      summary: List AHIP records for an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of AHIP records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AhipRecord"
    post:
      operationId: createAgentAhip
      tags: [ahip]
      summary: Create an AHIP record for an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAhipBody"
      responses:
        "201":
          description: Created AHIP record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AhipRecord"

  /agents/{id}/ahip/{aid}:
    patch:
      operationId: updateAgentAhip
      tags: [ahip]
      summary: Update an AHIP record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: aid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAhipBody"
      responses:
        "200":
          description: Updated AHIP record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AhipRecord"

  /ahip/dashboard:
    get:
      operationId: getAhipDashboard
      tags: [ahip]
      summary: Get agency-wide AHIP completion dashboard
      parameters:
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: AHIP dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AhipDashboard"

  /carriers:
    get:
      operationId: getCarriers
      tags: [carriers]
      summary: List carriers for the organization
      responses:
        "200":
          description: List of carriers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Carrier"
    post:
      operationId: createCarrier
      tags: [carriers]
      summary: Create a carrier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCarrierBody"
      responses:
        "201":
          description: Created carrier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Carrier"

  /carriers/seed:
    post:
      operationId: seedCarriers
      tags: [carriers]
      summary: Seed default Medicare carriers
      responses:
        "200":
          description: Seeded carriers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedCarriersResponse"

  /carriers/{id}:
    patch:
      operationId: updateCarrier
      tags: [carriers]
      summary: Update a carrier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCarrierBody"
      responses:
        "200":
          description: Updated carrier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Carrier"
    delete:
      operationId: deleteCarrier
      tags: [carriers]
      summary: Delete a carrier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /agents/{id}/checklists:
    get:
      operationId: getAgentChecklists
      tags: [checklists]
      summary: List checklist runs for an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of checklist runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistRun"
    post:
      operationId: createAgentChecklist
      tags: [checklists]
      summary: Start a checklist run for an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChecklistBody"
      responses:
        "201":
          description: Created checklist run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistRun"

  /agents/{id}/checklists/{runId}:
    get:
      operationId: getAgentChecklist
      tags: [checklists]
      summary: Get a checklist run with its items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checklist run with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistRunDetail"

  /checklists/{runId}/items/{itemId}:
    patch:
      operationId: updateChecklistItem
      tags: [checklists]
      summary: Update a checklist item status
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChecklistItemBody"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"

  /agents/{id}/tech-stack:
    get:
      operationId: getAgentTechStack
      tags: [techstack]
      summary: List tech stack accounts for an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of tech stack accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechStackAccount"
    post:
      operationId: createAgentTechStackAccount
      tags: [techstack]
      summary: Add a tech stack account to an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTechStackAccountBody"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechStackAccount"

  /agents/{id}/tech-stack/bulk:
    patch:
      operationId: bulkUpdateAgentTechStack
      tags: [techstack]
      summary: Bulk update tech stack account statuses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateTechStackBody"
      responses:
        "200":
          description: Updated accounts list
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: array
                    items:
                      $ref: "#/components/schemas/TechStackAccount"
                required:
                  - updated

  /agents/{id}/tech-stack/pdf:
    get:
      operationId: getAgentTechStackPdf
      tags: [techstack]
      summary: Export tech stack status as PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /agents/{id}/tech-stack/{aid}:
    patch:
      operationId: updateAgentTechStackAccount
      tags: [techstack]
      summary: Update a tech stack account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: aid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTechStackAccountBody"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechStackAccount"

  /platform-requirements:
    get:
      operationId: getPlatformRequirements
      tags: [techstack]
      summary: List platform requirements
      responses:
        "200":
          description: List of requirements
          content:
            application/json:
